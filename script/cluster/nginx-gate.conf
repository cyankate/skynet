# 不要 nginx -c 这份当主配置，会丢掉网站的 http。
# 用法：在 /etc/nginx/nginx.conf 里、http { } 外面加一行：
#   include /绝对路径/script/cluster/nginx-gate.conf;
# 然后 nginx -t && nginx -s reload
#
# game 要打开 gate_behind_lb=1，门听 127.0.0.1:19001/19002。
# Ubuntu 需已装 libnginx-mod-stream，主配置顶部会 load_module。

stream {
    upstream game_gates {
        least_conn;
        server 127.0.0.1:19001;
        server 127.0.0.1:19002;
    }
    server {
        listen 8000;
        proxy_pass game_gates;
        proxy_connect_timeout 3s;
        proxy_timeout 86400s;
    }
}
